server {
    include /etc/nginx/snippets/block-next-action.conf;
    server_name tools.bainslamusic.com;

    root /var/www/tools.bainslamusic.com;
    index index.html;

    client_max_body_size 45m;

    location /api/remove-bg {
        proxy_pass http://127.0.0.1:8091/remove-bg;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location /api/bg-health {
        proxy_pass http://127.0.0.1:8091/health;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /_next/ {
        expires 365d;
        add_header Cache-Control 'public, immutable';
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mjs|wasm)$ {
        expires 30d;
        add_header Cache-Control 'public';
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tools.bainslamusic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tools.bainslamusic.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    include /etc/nginx/snippets/block-next-action.conf;
    if ($host = tools.bainslamusic.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name tools.bainslamusic.com;
    return 404;
}
